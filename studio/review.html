<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick takes · RL Career Casters</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --line: #2a3340;
    --text: #e6edf3; --dim: #8b98a7; --blue: #2f81f7; --orange: #f0883e;
    --good: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(14,17,22,.96); border-bottom: 1px solid var(--line); padding: 12px 20px 10px; backdrop-filter: blur(6px); }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  h1 span { color: var(--dim); font-weight: 450; }
  .grow { flex: 1; }
  button, select, label.btn { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover, label.btn:hover { border-color: #3d4a5c; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin-top: 10px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .counts { color: var(--dim); font-size: 13px; margin-top: 6px; display: flex; gap: 16px; flex-wrap: wrap; }
  .counts b { color: var(--text); font-weight: 600; }
  .keys { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  kbd { font: 12px ui-monospace, Consolas, monospace; background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text); }
  main { max-width: 980px; margin: 0 auto; padding: 14px 20px 120px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: center; }
  .row.cur { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
  .row .n { color: var(--dim); font-size: 12px; text-align: right; align-self: start; padding-top: 3px; }
  .row .txt { font-size: 16px; }
  .row .meta { grid-column: 2; color: var(--dim); font-size: 12.5px; }
  .row .meta .pbp { color: var(--blue); } .row .meta .color { color: var(--orange); }
  .ctl { grid-column: 2 / 4; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .row:not(.cur) .ctl { display: none; }
  .take { min-width: 150px; text-align: left; }
  .take.playing { border-color: var(--good); color: var(--good); }
  .sc { font-size: 12px; color: var(--dim); margin-left: 6px; }
  .sc.low { color: var(--warn); }
  .keep.on { background: rgba(63,185,80,.15); border-color: var(--good); color: var(--good); }
  .redo.on { background: rgba(248,81,73,.13); border-color: var(--bad); color: var(--bad); }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; align-self: start; }
  .tag.t1, .tag.t2 { background: rgba(63,185,80,.15); color: var(--good); }
  .tag.redo { background: rgba(248,81,73,.13); color: var(--bad); }
  .tag.todo { background: var(--panel2); color: var(--dim); }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Pick takes <span id="packname"></span></h1>
    <div class="grow"></div>
    <select id="filter" title="Which lines to show">
      <option value="todo">Still to pick</option>
      <option value="all">All lines</option>
      <option value="redo">Marked redo</option>
      <option value="done">Picked</option>
    </select>
    <label title="After you pick, play the next line's two takes"><input type="checkbox" id="autoplay" checked> Auto-play next</label>
    <label class="btn" title="Load a choices.json you saved earlier">Load…<input type="file" id="load" accept=".json,application/json"></label>
    <button class="primary" id="save">Save choices</button>
  </div>
  <div class="bar" id="bar"></div>
  <div class="counts" id="counts"></div>
  <div class="keys">
    <kbd>Space</kbd> play both &nbsp; <kbd>1</kbd> <kbd>2</kbd> play one &nbsp;
    <kbd>Q</kbd> keep take 1 &nbsp; <kbd>W</kbd> keep take 2 &nbsp; <kbd>R</kbd> redo both &nbsp;
    <kbd>Backspace</kbd> clear &nbsp; <kbd>↑</kbd> <kbd>↓</kbd> move
  </div>
</header>
<main id="list"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__REVIEW_DATA__*/null;

const $ = (id) => document.getElementById(id);
const items = (DATA && DATA.items) || [];
const storeKey = 'rlcc-review:' + (DATA ? DATA.pack + ':' + DATA.made : 'none');
let choices = {};
try { choices = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch (e) { choices = {}; }
for (const it of items) if (it.choice !== null && it.choice !== undefined && !choices[it.k]) choices[it.k] = String(it.choice + 1);
let cur = 0;          // index into the visible list
let visible = [];
const audio = new Audio();
let queue = [];       // takes still to play in a "play both"
let playing = null;   // [itemKey, takeIndex]

const MOOD = { hype: 'hype', lively: 'lively', calm: 'calm' };
const ROLE = { pbp: 'Play-by-play', color: 'Analyst' };

function persist() { try { localStorage.setItem(storeKey, JSON.stringify(choices)); } catch (e) {} }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function matches(it) {
  const c = choices[it.k], f = $('filter').value;
  return f === 'all' || (f === 'todo' && !c) || (f === 'redo' && c === 'redo') || (f === 'done' && c && c !== 'redo');
}

function render(keepKey) {
  const key = keepKey || (visible[cur] && visible[cur].k);
  visible = items.filter(matches);
  cur = Math.max(0, visible.findIndex((it) => it.k === key));
  if (cur < 0 || cur >= visible.length) cur = 0;
  const list = $('list');
  if (!items.length) { list.innerHTML = '<div class="empty">No takes in this review. Run <code>python studio_cloud.py review</code> to make one.</div>'; counts(); return; }
  if (!visible.length) { list.innerHTML = '<div class="empty">Nothing here. ' + ($('filter').value === 'todo' ? 'Every line has a pick. Click <b>Save choices</b>.' : '') + '</div>'; counts(); return; }
  list.innerHTML = visible.map((it, i) => {
    const c = choices[it.k];
    const tag = c === '1' ? '<span class="tag t1">Take 1</span>' : c === '2' ? '<span class="tag t2">Take 2</span>' : c === 'redo' ? '<span class="tag redo">Redo</span>' : '<span class="tag todo">To pick</span>';
    const sc = (s) => `<span class="sc ${s < 0.8 ? 'low' : ''}">checker ${Math.round(Math.max(0, s) * 100)}%</span>`;
    return `<div class="row ${i === cur ? 'cur' : ''}" data-i="${i}">
      <div class="n">${items.indexOf(it) + 1}</div>
      <div class="txt">${esc(it.text)}</div>
      ${tag}
      <div class="meta"><span class="${it.role}">${ROLE[it.role] || it.role}</span> · ${MOOD[it.mood] || it.mood} · ${esc(it.cat)}</div>
      <div class="ctl">
        <button class="take" data-play="0">▶ Take 1 ${sc(it.scores[0])}</button>
        <button class="take" data-play="1">▶ Take 2 ${sc(it.scores[1])}</button>
        <button class="keep ${c === '1' ? 'on' : ''}" data-pick="1">Keep take 1</button>
        <button class="keep ${c === '2' ? 'on' : ''}" data-pick="2">Keep take 2</button>
        <button class="redo ${c === 'redo' ? 'on' : ''}" data-pick="redo">Redo both</button>
      </div>
    </div>`;
  }).join('');
  counts();
  markPlaying();
}

function counts() {
  const n = items.length;
  let k1 = 0, k2 = 0, r = 0;
  for (const it of items) { const c = choices[it.k]; if (c === '1') k1++; else if (c === '2') k2++; else if (c === 'redo') r++; }
  const left = n - k1 - k2 - r;
  $('counts').innerHTML = `<span><b>${n - left}</b> of <b>${n}</b> picked</span><span>take 1: <b>${k1}</b></span><span>take 2: <b>${k2}</b></span><span>redo: <b>${r}</b></span><span>left: <b>${left}</b></span>`;
  const pct = (x) => (n ? (100 * x) / n : 0) + '%';
  $('bar').innerHTML = `<i style="width:${pct(k1 + k2)};background:var(--good)"></i><i style="width:${pct(r)};background:var(--bad)"></i>`;
}

function scrollCur() {
  const el = document.querySelector('.row.cur');
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function select(i) {
  if (!visible.length) return;
  cur = Math.max(0, Math.min(visible.length - 1, i));
  document.querySelectorAll('.row').forEach((r) => r.classList.toggle('cur', +r.dataset.i === cur));
  scrollCur();
}

function play(take) {
  const it = visible[cur];
  if (!it) return;
  queue = [];
  start(it, take);
}
function playBoth() {
  const it = visible[cur];
  if (!it) return;
  queue = [[it, 1]];
  start(it, 0);
}
function start(it, take) {
  playing = [it.k, take];
  audio.src = it.takes[take];
  audio.currentTime = 0;
  audio.play().catch(() => toast('Could not play ' + it.takes[take] + ': keep review.html in the unzipped folder.'));
  markPlaying();
}
audio.addEventListener('ended', () => {
  const next = queue.shift();
  if (next) setTimeout(() => start(next[0], next[1]), 250);
  else { playing = null; markPlaying(); }
});
function markPlaying() {
  document.querySelectorAll('.take').forEach((b) => b.classList.remove('playing'));
  if (!playing) return;
  const i = visible.findIndex((it) => it.k === playing[0]);
  const row = document.querySelector(`.row[data-i="${i}"]`);
  if (row) { const b = row.querySelectorAll('.take')[playing[1]]; if (b) b.classList.add('playing'); }
}

function pick(c) {
  const it = visible[cur];
  if (!it) return;
  if (c === null) delete choices[it.k]; else choices[it.k] = c;
  persist();
  audio.pause(); queue = []; playing = null;
  const f = $('filter').value;
  // move on to the next line that still needs a pick
  let nextKey = null;
  for (let j = cur + 1; j < visible.length; j++) if (!choices[visible[j].k]) { nextKey = visible[j].k; break; }
  if (!nextKey && c !== null) for (let j = 0; j < cur; j++) if (!choices[visible[j].k]) { nextKey = visible[j].k; break; }
  if (f === 'all' || c === null) {
    render(it.k);
    if (c !== null && nextKey) { select(visible.findIndex((x) => x.k === nextKey)); if ($('autoplay').checked) playBoth(); }
  } else {
    render(nextKey || it.k);
    scrollCur();
    if (nextKey && $('autoplay').checked && c !== null) playBoth();
  }
  if (c !== null && !items.some((x) => !choices[x.k])) toast('All picked. Click "Save choices".');
}

function save() {
  const picked = {};
  for (const it of items) if (choices[it.k]) picked[it.k] = choices[it.k];
  const blob = new Blob([JSON.stringify({ pack: DATA && DATA.pack, review: DATA && DATA.made, choices: picked }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'choices.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Saved ${Object.keys(picked).length} picks to choices.json`);
}

$('list').addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const i = +row.dataset.i;
  if (i !== cur) select(i);
  const p = e.target.closest('[data-play]');
  if (p) return play(+p.dataset.play);
  const k = e.target.closest('[data-pick]');
  if (k) pick(choices[visible[cur].k] === k.dataset.pick ? null : k.dataset.pick);
});
$('filter').addEventListener('change', () => { render(); scrollCur(); });
$('save').addEventListener('click', save);
$('load').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const c = j.choices || j;
    let n = 0;
    for (const it of items) if (c[it.k]) { choices[it.k] = String(c[it.k]); n++; }
    persist(); render(); toast(`Loaded ${n} picks`);
  } catch (err) { toast('That file is not a choices.json'); }
  e.target.value = '';
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); playBoth(); }
  else if (k === '1') play(0);
  else if (k === '2') play(1);
  else if (k === 'q') pick('1');
  else if (k === 'w') pick('2');
  else if (k === 'r') pick('redo');
  else if (k === 'backspace') { e.preventDefault(); pick(null); }
  else if (k === 'arrowdown' || k === 'j' || k === 'enter') { e.preventDefault(); select(cur + 1); }
  else if (k === 'arrowup' || k === 'k') { e.preventDefault(); select(cur - 1); }
});
window.addEventListener('beforeunload', persist);

$('packname').textContent = DATA ? '· ' + DATA.pack : '';
render();
</script>
</body>
</html>
